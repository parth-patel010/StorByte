[package]
name = "storbyte"
version = "0.1.0"
description = "Storbyte virtual cloud drive"
authors = ["Storbyte"]
edition = "2021"

[lib]
name = "storbyte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chacha20 = "0.9"
directories = "6"
parking_lot = "0.12"
bytes = "1"
async-trait = "0.1"
once_cell = "1"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
tiny_http = "0.12"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13.1", default-features = false, features = ["delayload", "windows-61"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13.1", default-features = false, features = ["delayload", "build"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3
strip = true
